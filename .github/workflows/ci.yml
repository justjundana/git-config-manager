name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        if: matrix.os != 'windows-latest'
        run: go test -race -coverprofile=coverage.out ./...

      # Packages verified to hold on Windows. Kept blocking.
      #
      # -race is omitted throughout: the detector needs a gcc toolchain the
      # Windows runner does not ship with.
      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go test -run '^$' ./...
          go test ./cmd/... ./internal/container/... ./internal/gitlab/... ./internal/provider/... ./internal/providerclient/... ./internal/shell/... ./pkg/...

      # The rest of the suite has never been executed on Windows, so its true
      # state is unknown rather than good. Much of it asserts POSIX mode bits
      # or uses chmod to block access — neither of which means anything on
      # Windows — so failures here are expected until those tests are made
      # portable.
      #
      # Reported, not enforced: this exists to produce the evidence needed to
      # fix them, without pretending the platform is already supported.
      - name: Run tests (Windows, full suite — informational)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: go test ./...

      - name: Validate Windows installer wrapper
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: scripts\install.bat --help

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --disable-all -E govet

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The install/uninstall scripts delete keys, rewrite shell rc files and
      # touch the keychain, so a shell bug there costs the user real data.
      # Gated at warning severity now that the scripts are clean at that level.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning --format=gcc scripts/*.sh

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  release-smoke:
    name: Release Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, shellcheck, govulncheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Validate Unix installer
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --help >/dev/null

      # Both PowerShell scripts are parsed. uninstall.ps1 deletes SSH/GPG keys
      # and rewrites git config, so a syntax error there is not cosmetic — it
      # aborts the script part-way through, after earlier steps have already
      # changed the machine.
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Parse errors in ${script}:"
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          ./scripts/install.ps1 -Help

      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish

  release:
    name: Release
    needs: [release-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
